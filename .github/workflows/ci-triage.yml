name: CI triage
# Bot phân tích lỗi CI (bước 1: chỉ bình luận). Chạy khi workflow Build của một pull request bị lỗi:
# phân loại lỗi bằng mô hình (CPU), Claude Code đọc code để tìm nguyên nhân (chỉ đọc), chọn người xử lý theo quy tắc,
# rồi bình luận vào pull request. Cần secret CLAUDE_CODE_OAUTH_TOKEN (claude setup-token) và KAGGLE_API_TOKEN.
# 24/11: bản sửa của agent qua chốt phạm vi; nếu còn thay đổi ngoài file test thì job `verify` (KHÔNG có secret,
# permissions rỗng, code của PR chỉ chạy trong container) áp bản sửa và chạy lại đúng bước CI lỗi; job `report` điền
# kết quả vào bình luận. Code của PR không bao giờ chạy trong job có secret.
on:
  workflow_run:
    workflows: [Build]
    types: [completed]

permissions:
  actions: write   # ghi cache (thư viện, mô hình) cho lần chạy sau
  contents: read
  pull-requests: write
  issues: write

jobs:
  triage:
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache model downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/pip
          key: p3-triage-v1
      - name: Install
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q transformers numpy pandas pyarrow duckdb requests kaggle six pyyaml
          npm install -g @anthropic-ai/claude-code
      - name: Download model and code (private Kaggle datasets)
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          for ds in p3-demo p3-c-weights p3-cause-weights; do
            kaggle datasets download "ducanhpham2k5/$ds" -p "$HOME/p3/$ds" --unzip --force
          done
          cd "$HOME/p3/p3-demo"
          if [ -f p3demo_code.zip ] && [ ! -d p3demo_code/src ]; then python -c "import zipfile; zipfile.ZipFile('p3demo_code.zip').extractall('p3demo_code')"; fi
          ls "$HOME/p3/p3-demo" "$HOME/p3/p3-c-weights" "$HOME/p3/p3-cause-weights"
      - name: Triage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          P3_AGENT_WS: ${{ runner.temp }}/ws
          P3_REPO_CACHE: ${{ runner.temp }}/repos
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          cd "$HOME/p3/p3-demo/p3demo_code"
          export PYTHONPATH="$PWD/src"
          python -m project3.demo.bot --repo "${{ github.repository }}" --run-id "${{ github.event.workflow_run.id }}" \
            ${PR:+--pr "$PR"} --bundle "$HOME/p3/p3-demo" \
            --weights "$HOME/p3/p3-c-weights/C_s0_fold{fold}.model_soft0.pt" \
            --cause-weights "$HOME/p3/p3-cause-weights/CAUSED_s0_fold{fold}.model_soft0.pt" \
            --verify-out "$RUNNER_TEMP/plan.json"
      - id: plan
        if: always()
        run: echo "plan=$([ -f "$RUNNER_TEMP/plan.json" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.plan == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: verify-plan
          path: ${{ runner.temp }}/plan.json

  verify:
    # Chạy thử bản sửa: không secret, GITHUB_TOKEN không quyền gì. Code của PR (lệnh build, test, plugin) chỉ chạy
    # trong container Docker không đặc quyền, không nhận biến môi trường của runner.
    needs: triage
    if: needs.triage.outputs.plan == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: {}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verify-plan
          path: plan
      - name: Prepare working copies (no code of the PR is executed here)
        # A = commit lỗi + bản sửa code, test GỐC. Khi agent sửa test (25/11, fail-to-pass như SWE-bench):
        # B = commit lỗi + mọi thay đổi (phải pass); C = code trước PR + file test đã sửa (phải fail).
        run: |
          python3 - <<'PY'
          import json, subprocess, pathlib, shutil
          p = json.load(open("plan/plan.json"))
          def checkout(name, sha):
              d = pathlib.Path(name); d.mkdir()
              g = lambda *a: subprocess.run(["git", "-C", name, *a], check=True)
              g("init", "-q"); g("fetch", "-q", "--depth", "1", f"https://github.com/{p['repo']}", sha); g("checkout", "-q", "FETCH_HEAD")
              return d
          def apply(d, edits):
              for e in edits:
                  f = d / e["path"]; t = f.read_text(encoding="utf-8")
                  assert t.count(e["old_text"]) == 1, e["path"]
                  f.write_text(t.replace(e["old_text"], e["new_text"]), encoding="utf-8")
          runs = []
          if p["edits"]:
              apply(checkout("wA", p["sha"]), p["edits"]); runs.append("A")
          if p.get("test_edits"):
              b = checkout("wB", p["sha"]); apply(b, p["edits"] + p["test_edits"]); runs.append("B")
              if p.get("base_sha"):
                  c = checkout("wC", p["base_sha"])
                  for path in dict.fromkeys(e["path"] for e in p["test_edits"]):
                      (c / path).parent.mkdir(parents=True, exist_ok=True); shutil.copyfile(b / path, c / path)
                  runs.append("C")
          pathlib.Path("runs").write_text(" ".join(runs))
          pathlib.Path("cmd.sh").write_text("set -e\n" + p["cmd"] + "\n")
          pathlib.Path("java").write_text(p["java"])
          PY
          cat runs
      - name: Re-run the failed CI step (inside container)
        run: |
          # Thư viện Maven dùng chung giữa các lượt (volume Docker m2, chỉ sống trong job này). Lỗi tải thư viện
          # (vd Maven Central trả 429) = lỗi hạ tầng: thử lại tối đa 3 lần, không tính là test fail.
          INFRA='status code: 429|Could not transfer artifact|Could not resolve dependencies|Unresolveable build extension|Connection reset|Connection timed out|Temporary failure in name resolution'
          for r in $(cat runs); do
            for attempt in 1 2 3; do
              start=$(date +%s)
              set +e
              timeout 12m docker run --rm -v m2:/root/.m2 -v "$PWD/w$r:/w" -v "$PWD/cmd.sh:/cmd.sh:ro" -w /w \
                "maven:3.9-eclipse-temurin-$(cat java)" bash /cmd.sh > "out$r.log" 2>&1
              code=$?
              set -e
              if [ $code -eq 0 ] || ! grep -qE "$INFRA" "out$r.log"; then break; fi
              echo "== $r: lỗi tải thư viện, thử lại lần $((attempt + 1))"; sleep $((attempt * 60))
            done
            python3 - "$r" "$code" "$(( $(date +%s) - start ))" "$INFRA" <<'PY'
          import json, os, re, sys
          r, code, sec, infra = sys.argv[1], int(sys.argv[2]), int(sys.argv[3]), sys.argv[4]
          text = open(f"out{r}.log", encoding="utf-8", errors="replace").read()
          lines = text.splitlines()
          # pass / test_fail / compile_fail / infra / fail — C chỉ tính là "fail" khi test_fail hoặc compile_fail
          if code == 0:
              status = "pass"
          elif re.search(r"Tests run: \d+, Failures: [1-9]|Tests run: \d+, Failures: \d+, Errors: [1-9]|There are test failures", text):
              status = "test_fail"
          elif "COMPILATION ERROR" in text:
              status = "compile_fail"
          elif re.search(infra, text):
              status = "infra"
          else:
              status = "fail"
          # dòng lỗi + dòng tổng kết (bỏ "Tests run ... -- in <lớp>" của từng lớp test khi lớp đó không lỗi)
          key = [l for l in lines if re.search(r"ERROR|FAIL|BUILD (SUCCESS|FAILURE)", l)
                 or ("Tests run:" in l and " -- in " not in l)]
          res = json.load(open("result.json")) if os.path.exists("result.json") else {}
          res[r] = {"exit": code, "status": status, "seconds": sec, "key": key[-40:], "tail": lines[-15:]}
          json.dump(res, open("result.json", "w"))
          print(r, status)
          PY
            tail -15 "out$r.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-result
          path: result.json

  report:
    needs: [triage, verify]
    if: always() && needs.triage.outputs.plan == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: verify-plan
          path: plan
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: verify-result
          path: res
      - name: Write result into the bot comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          def api(m, path, body=None):
              r = urllib.request.Request("https://api.github.com" + path, method=m,
                  data=json.dumps(body).encode() if body else None,
                  headers={"Authorization": "Bearer " + os.environ["GITHUB_TOKEN"], "Accept": "application/vnd.github+json"})
              return json.load(urllib.request.urlopen(r))
          clean = lambda s: s.replace("```", "'''").replace("<!--", "<!_-")[:300]
          plan = json.load(open("plan/plan.json")) if os.path.exists("plan/plan.json") else {}
          step = plan.get("step", "?")
          R = json.load(open("res/result.json")) if os.path.exists("res/result.json") else {}
          log = lambda r, t: (f"<details><summary>{t}</summary>\n\n```\n"
                              + "\n".join(clean(l) for l in (r["key"] or r["tail"])) + "\n```\n</details>")
          parts = []
          INFRA = "⚠️ Không chạy được do lỗi tải thư viện (hạ tầng, đã thử lại 3 lần) — chạy lại job sau."
          if "A" in R:
              r = R["A"]
              head = (f"✅ Bản sửa code **chạy qua** bước `{step}`" if r["status"] == "pass" else INFRA
                      if r["status"] == "infra" else f"❌ Bản sửa code **chưa qua** bước `{step}` ({r['status']})")
              parts.append(f"{head} · {r['seconds']} giây · test giữ nguyên bản gốc\n\n" + log(r, "Log chạy thử (test gốc)"))
          if "B" in R:  # 25/11: fail-to-pass cho test đã sửa (SWE-bench / SWT-bench)
              b, c = R["B"], R.get("C")
              if b["status"] == "infra":
                  v = INFRA
              elif b["status"] != "pass":
                  v = f"❌ Test đã sửa **vẫn fail** trên code của PR (+ bản sửa) ({b['status']})."
              elif c is None:
                  v = "⚠️ Test đã sửa pass trên code của PR; không lấy được code trước PR để kiểm tra fail-to-pass."
              elif c["status"] not in ("pass", "test_fail", "compile_fail"):
                  v = (f"⚠️ Test đã sửa pass trên code của PR; trên code trước PR không chạy được ({c['status']}) "
                       "nên chưa kết luận được fail-to-pass.")
              elif c["status"] != "pass":
                  v = ("✅ Test đã sửa đạt **fail-to-pass**: fail trên code trước PR, pass trên code của PR → test "
                       "kiểm tra đúng hành vi mới. Người duyệt vẫn cần xác nhận hành vi mới là đúng ý.")
              else:
                  v = ("⚠️ Test đã sửa **pass cả trên code trước PR** → không còn phân biệt hành vi cũ / mới, "
                       "có thể đã bị làm yếu. Không nên áp.")
              parts.append(f"**Kiểm tra test đã sửa:** {v}\n\n" + log(b, "Log: code của PR + test đã sửa")
                           + ("\n\n" + log(c, "Log: code trước PR + test đã sửa") if c else ""))
          text = ("\n\n".join(parts) + f"\n\n<sub>Chạy trên máy riêng không có secret · [log]({os.environ['RUN_URL']})</sub>"
                  if parts else f"⚠️ Không chạy thử được ([log]({os.environ['RUN_URL']})).")
          pr, repo, mark = os.environ["PR"], os.environ["REPO"], "<!-- p3-verify -->"
          cs = [c for c in api("GET", f"/repos/{repo}/issues/{pr}/comments?per_page=100") if mark in (c["body"] or "")]
          if cs:
              b = cs[-1]["body"]
              b = re.sub(re.escape(mark) + ".*?" + re.escape(mark), lambda _: mark + "\n" + text + "\n" + mark, b, flags=re.S)
              api("PATCH", f"/repos/{repo}/issues/comments/{cs[-1]['id']}", {"body": b})
              print("đã điền kết quả")
          PY
